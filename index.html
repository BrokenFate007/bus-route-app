<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IIT Palakkad Shuttle & Mess Menu</title>

  <!-- Mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" href="./icons/android-launchericon-192-192.png">
  <link rel="apple-touch-icon" href="./icons/android-launchericon-192-192.png">
  <link rel="shortcut icon" href="./icons/android-launchericon-192-192.png">
  
  <!-- Theme color - CHANGED TO DARK -->
  <meta name="theme-color" content="#0f172a">
  
  <!-- iOS specific -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IITPKD Bus & Mess">
  <link rel="apple-touch-icon" href="./icons/android-launchericon-192-192.png">
  
  <!-- Description for SEO -->
  <meta name="description" content="Real-time bus schedules and daily mess menu for IIT Palakkad">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Analytics - ENHANCED VERSION -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0KC4TPQ1NK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    
    // Basic configuration
    gtag('config', 'G-0KC4TPQ1NK', { 
      anonymize_ip: true,
      send_page_view: true
    });
    
    // Track if app is installed (standalone mode)
    const isInstalled = window.matchMedia('(display-mode: standalone)').matches;
    gtag('event', 'page_view', {
      'app_mode': isInstalled ? 'installed_pwa' : 'web_browser'
    });
  </script>

</head>

<body>

  <main class="container">

    <h1>IIT Palakkad Shuttle & Mess Menu</h1>

    <!-- Clock -->
    <div id="clock" class="clock"></div>

    <!-- Install App Button -->
    <div id="installContainer" class="install-container hidden">
      <button id="installButton" class="install-btn">
        Install App
      </button>
    </div>

    <!-- MAIN VIEWS WRAPPER -->
    <div id="viewContainer">
      <!-- ================= BUS VIEW ================= -->
      <div id="busView">

        <!-- ===== Next Bus ===== -->
        <div class="direction-buttons">
          <button id="btnNilaToSahyadri" class="dir-btn">
            Nila → Sahyadri
          </button>

          <button id="btnSahyadriToNila" class="dir-btn">
            Sahyadri → Nila
          </button>
        </div>

    <div id="results"></div>

    <!-- ===== Journey Planner (Campus) ===== -->
    <section class="journey">

      <button
        id="journeyToggle"
        class="journey-toggle"
        type="button">
        Plan a Journey (Campus)
        <span class="arrow">▾</span>
      </button>

      <div id="journeyPanel" class="journey-panel hidden">

        <!-- Day Selection (Full Width) -->
        <div class="journey-controls full">
          <select id="journeyDay" aria-label="Day">
            <option value="">Day</option>
          </select>
        </div>

        <!-- Time Picker (Full Width) -->
        <div class="journey-controls full">
          <div class="time-picker">
            <select id="journeyHour">
              <option value="">Hour</option>
            </select>

            <select id="journeyMinute">
              <option value="">Min</option>
            </select>

            <select id="journeyPeriod">
              <option value="">AM/PM</option>
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </div>

        <!-- From and To -->
        <div class="journey-controls route-select-container">
          <select id="journeyFrom" aria-label="Boarding stop">
            <option value="">From</option>
          </select>

          <button id="btnSwapRoute" type="button" class="swap-btn" aria-label="Swap Routes">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
          </button>

          <select id="journeyTo" aria-label="Destination stop">
            <option value="">To</option>
          </select>
        </div>

        <!-- Find Button -->
        <div class="journey-controls full">
          <button
            id="journeySearch"
            type="button">
            Find buses
          </button>
        </div>

        <div id="journeyResults" class="journey-results"></div>

      </div>
    </section>

    <!-- ===== Outside Campus Buses ===== -->
    <section class="journey outside-campus">

      <button
        id="outsideCampusToggle"
        class="journey-toggle"
        type="button">
        Outside Campus Buses
        <span class="arrow">▾</span>
      </button>

      <div id="outsideCampusPanel" class="journey-panel hidden">

        <div class="journey-controls outside-three-col">
          <select id="outsideDay" aria-label="Day">
            <option value="">Select Day</option>
          </select>

          <select id="outsideTimePeriod" aria-label="Time Period">
            <option value="">Time</option>
            <option value="all">All Day</option>
            <option value="morning">🌅 Morning</option>
            <option value="afternoon">☀️ Afternoon</option>
            <option value="evening">🌆 Evening</option>
          </select>

          <select id="outsideDestination" aria-label="Destination">
            <option value="">Bus Stop</option>
          </select>
        </div>

        <div class="journey-controls full">
          <button
            id="outsideSearch"
            type="button">
            Find Buses
          </button>
        </div>

        <div id="outsideResults" class="outside-results"></div>

      </div>
      </div>
    </section>
    
      </div> <!-- End of Bus View -->

      <!-- ================= FOOD VIEW ================= -->
      <div id="foodView" class="hidden">
        <div class="food-controls">
          <select id="foodDaySelect" aria-label="Day">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>

          <!-- Veg / Non-Veg Toggle -->
          <div class="preference-toggle">
            <button id="btnPrefVeg" class="pref-btn active" type="button">
              <span class="dot veg-dot"></span> Veg
            </button>
            <button id="btnPrefNonVeg" class="pref-btn" type="button">
              <span class="dot nonveg-dot"></span> Non-Veg
            </button>
          </div>
        </div>
        
        <!-- Featured Podium Meal -->
        <div id="foodPodium" class="food-podium">
          <!-- Rendered dynamically -->
        </div>

        <!-- Collapsible Full Day Menu -->
        <div class="full-day-toggle-container">
          <button id="btnToggleFullDay" class="journey-toggle" type="button">
            Show Full Day Menu <span class="arrow">▾</span>
          </button>
        </div>

        <div id="foodFullDayContainer" class="food-full-day-container hidden">
          <!-- Rendered dynamically -->
        </div>
      </div> <!-- End of Food View -->
    
    </div> <!-- End of viewContainer -->

    <footer class="site-footer">
    <div class="footer-line primary">
      Created by <span class="name">Krishna Murari</span>
    </div>

    <div class="footer-line secondary">
      Vibro-Acoustic Lab · IIT Palakkad (Alumni)
    </div>

    <div class="footer-line version">
      Version: <span id="appVersion">Loading...</span>
    </div>
  </footer>


  </main>

  <!-- ================= BOTTOM NAVIGATION ================= -->
  <nav class="bottom-nav">
    <button id="navBus" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2l.64-2.54c.24-.96.36-1.92.36-2.96V9a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2.5c0 1.04.12 2 .36 2.96L3 17h2"/><path d="M14 17h-4"/><path d="M6 17v3a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1v-3"/><path d="M16 17v3a1 1 0 0 0 1 1h0a1 1 0 0 0 1-1v-3"/><path d="M4.5 8h15"/><path d="M8 13h.01"/><path d="M16 13h.01"/></svg>
      <span>Bus</span>
    </button>
    <button id="navFood" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
      <span>Food</span>
    </button>
  </nav>

  <!-- Scripts: Load in correct order -->
  <script src="js/analytics.js"></script>
  <script src="js/clock.js" defer></script>
  <script src="js/dataLoader.js"></script>
  <script src="js/routeEngine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/install.js"></script>

</body>
</html>
